[project]
name = "rover"
version = "0.1.0"
description = "Rover evaluation project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["*.py", "prompt/*.json", "data/*", "test_video/*", "static/*"]

[tool.uv]
dev-dependencies = []
